<!DOCTYPE html>
<html>
    <head>
        <title>Flappy Auto</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <h1>Flappy Bird</h1>
        <div>
            <p>Generation: <span id="gen"></span></p>
            <p>Alive Birds: <span id="alive"></span></p>
            <p>Score: <span id="score"></span></p>
            <p>High Score: <span id="high"></span></p>
        </div>
        
        <canvas width="1920" height="1080" id="game"></canvas>

        <div style="display:none" id="assets">
            <img src="assets/bird.png" id="birdIMG">
        </div>
        
        <script src="main.js"></script>
    </body>
</html>
